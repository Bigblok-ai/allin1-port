name: Auto Merge Stream Data (M3U)

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Run Scraper Logic
        run: python port.py

      - name: Commit nếu có thay đổi
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Update output.m3u [skip ci]" && git push)
